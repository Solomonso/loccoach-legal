<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Email confirmed — LocCoach</title>
<meta name="robots" content="noindex">
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; line-height: 1.6; color: #2D1F1A; background: #FAF7F2; }
  a { color: #B84E36; }
  .card { text-align: center; margin: 56px 0; }
  .mark { width: 96px; height: 96px; border-radius: 28px; background: #E7F0E9; color: #3E7C52; display: flex; align-items: center; justify-content: center; margin: 0 auto 22px; font-size: 44px; }
  h1 { font-size: 28px; margin: 0 0 8px; }
  p { color: #6B5A52; margin: 0 auto; max-width: 34em; }
  .note { font-size: 14px; margin-top: 40px; }
  @media (prefers-color-scheme: dark) {
    body { color: #F3EAE4; background: #191310; }
    p { color: #B5A49B; }
    .mark { background: #223025; color: #7FB894; }
  }
</style>
</head>
<body>
<div class="card">
  <div class="mark" aria-hidden="true">&#10003;</div>
  <h1>Email confirmed</h1>
  <p>Your address is verified. Open LocCoach on your phone and sign in to pick up where you left off.</p>
</div>
<p class="note">Didn't expect this? Someone may have typed your address by mistake — you can ignore it, and no account will be usable without your password. Questions: <a href="mailto:support@loccoach.app">support@loccoach.app</a></p>
</body>
</html>
